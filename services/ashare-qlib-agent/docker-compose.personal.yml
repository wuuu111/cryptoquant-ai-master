services:
  backend:
    build:
      context: .
      dockerfile: deploy/personal/backend.Dockerfile
    env_file:
      - .env.deploy
    environment:
      FUND_AGENT_CONFIG: ${FUND_AGENT_CONFIG:-config.personal.example.yaml}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./registry:/app/registry
      - ./orders:/app/orders
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8710/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/personal/frontend.Dockerfile
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FUND_AGENT_HTTP_PORT:-8780}:80"
    restart: unless-stopped
